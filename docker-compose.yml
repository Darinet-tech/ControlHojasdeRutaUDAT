# Base de datos PostgreSQL para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mesa_pruebas
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: cambiar_esta_clave
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
